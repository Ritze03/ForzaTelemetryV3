[package]
name = "forza-telemetry"
version = "0.4.1"
edition = "2021"
rust-version = "1.91"

[[bin]]
name = "forza-telemetry"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33", features = ["default_fonts"] }
egui = "0.33"
egui_plot = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
dirs = "5"
tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
# Co-Op "Trystero" transport (src/coop/): serverless WebRTC mesh, signalled over public Nostr
# relays. No tokio anywhere: webrtc runs on smol. webrtc 0.21 needs rustc >= 1.91.
webrtc = { version = "0.21", default-features = false, features = ["runtime-smol", "crypto-ring"] }
smol = "2"
async-trait = "0.1"
bytes = "1"
k256 = { version = "0.14", default-features = false, features = ["schnorr", "std"] }
sha1 = "0.11"
sha2 = "0.11"
aes-gcm = "0.11"
getrandom = "0.4"
base64 = "0.22"
async-channel = "2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"
# HUD overlay (src/overlay/): wlr-layer-shell surface + EGL + egui_glow. All already built by
# eframe's tree; sctk pinned to 0.20 so only one wayland-client 0.31 instance exists.
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
glutin = { version = "0.32", default-features = false, features = ["egl", "wayland"] }
raw-window-handle = "0.6"
egui_glow = { version = "0.33", default-features = false }
# Opt-in X11/XWayland overlay backend (src/overlay/x11.rs). Same version and features winit
# already builds (libxcb loaded at runtime via dl-libxcb), so nothing new is compiled.
x11rb = { version = "0.13", features = ["allow-unsafe-code", "dl-libxcb", "randr", "shape"] }

[target.'cfg(target_os = "windows")'.dependencies]
enigo = "0.6"
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
