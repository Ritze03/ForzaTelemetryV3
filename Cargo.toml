[package]
name = "forza-telemetry"
version = "0.2.2"
edition = "2021"

[[bin]]
name = "forza-telemetry"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33", features = ["default_fonts"] }
egui = "0.33"
egui_plot = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
dirs = "5"
tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"

[target.'cfg(target_os = "windows")'.dependencies]
enigo = "0.6"
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
