<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FH6 roads (2D preview)</title>
<link rel="icon" href="data:,">
<!-- Template for preview_2d.py (it replaces the DATA placeholder below).  Roads only: transparent, frameless, no chrome.
     Keys: B = cycle backdrop (none / checkerboard / dark), F or double-click = fit island, wheel = zoom, drag = pan. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { cursor: grab; user-select: none; -webkit-user-select: none; }
  body.drag { cursor: grabbing; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: transparent; }
  body.bd-check { background-color: #2a2d33;
    background-image: linear-gradient(45deg, #353941 25%, transparent 25%, transparent 75%, #353941 75%), linear-gradient(45deg, #353941 25%, transparent 25%, transparent 75%, #353941 75%);
    background-size: 24px 24px; background-position: 0 0, 12px 12px; }
  body.bd-dark { background: #14171c; }
  #hint { position: fixed; left: 12px; bottom: 10px; font: 11px/1.3 system-ui, sans-serif; color: rgba(128,136,148,.9); text-shadow: 0 0 3px rgba(0,0,0,.6);
    pointer-events: none; transition: opacity 1.2s; opacity: 0; }
  #hint.on { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">wheel zoom &middot; drag pan &middot; F fit &middot; B backdrop</div>
<script>
'use strict';
const DATA = /*__DATA__*/null;

// ---- style per edge type: [fill colour, width factor, dash (px, null = solid), alpha, casing?] ----
const ASPHALT = '#f2f4f7', SAND = '#dcbf80';
const STYLE = {
  unset:        { col: '#8d96a3', w: 0.55, dash: [5, 4], alpha: 0.6,  casing: false },
  other:        { col: '#8e9aab', w: 0.7,  dash: null,   alpha: 1,    casing: true  },
  crosscountry: { col: '#a6d8ae', w: 0.5,  dash: [1, 4], alpha: 0.6,  casing: false },   // user lines, not in the game
  offroad:      { col: SAND,      w: 0.8,  dash: null,   alpha: 1,    casing: true  },
  trail:        { col: SAND,      w: 0.65, dash: [6, 4], alpha: 1,    casing: true  },   // dashed off-road line
  tunnel:       { col: ASPHALT,   w: 1.0,  dash: [2, 3], alpha: 0.55, casing: false },   // ghosted / dotted asphalt
  road:         { col: ASPHALT,   w: 1.0,  dash: null,   alpha: 1,    casing: true  },
};
const ORDER = ['unset', 'crosscountry', 'other', 'offroad', 'trail', 'tunnel', 'road'];   // draw order: asphalt on top
const CASING = 'rgba(8,11,16,0.5)', JUMP = '#ff9a3d';

// ---- data -> typed arrays in metres (data is integer decimetres, x east / z north) ----
const L = {};
let drawnTotal = 0;
for (const t of ORDER) {
  L[t] = (DATA.lines[t] || []).map((a) => {
    const f = new Float32Array(a.length); let x0 = 1e9, z0 = 1e9, x1 = -1e9, z1 = -1e9;
    for (let i = 0; i < a.length; i += 2) {
      const x = a[i] / 10, z = a[i + 1] / 10; f[i] = x; f[i + 1] = z;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (z < z0) z0 = z; if (z > z1) z1 = z;
    }
    return { p: f, b: [x0, z0, x1, z1] };
  });
}
const J = DATA.jumps.map((a) => a.map((v) => v / 10));
const BOUNDS = DATA.bounds.map((v) => v / 10);

// edge counts per type from the loaded geometry vs. the generator's counts from the input file
const have = { jump: J.length };
for (const t of ORDER) have[t] = L[t].reduce((n, o) => n + o.p.length / 2 - 1, 0);
const bad = Object.keys(DATA.counts).filter((t) => (have[t] || 0) !== DATA.counts[t]);
console.log('[preview2d] edges per type: ' + JSON.stringify(have) + (bad.length ? ' MISMATCH vs ' + JSON.stringify(DATA.counts) : ' (matches input file)') + ' src=' + JSON.stringify(DATA.src));
if (bad.length) console.error('[preview2d] edge count mismatch: ' + bad.join(','));

// ---- view ----
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1;
let cx = 0, cz = 0, s = 0.05;                       // centre (m) and scale (px per metre)
const MIN_S = 0.01, MAX_S = 6;
let raf = 0;
const sx = (x) => (x - cx) * s + W / 2, sy = (z) => (cz - z) * s + H / 2;

function fit() {
  const [x0, z0, x1, z1] = BOUNDS, m = 24;
  cx = (x0 + x1) / 2; cz = (z0 + z1) / 2;
  s = Math.max(MIN_S, Math.min((W - 2 * m) / (x1 - x0), (H - 2 * m) / (z1 - z0)));
  draw();
}
function resize() {
  dpr = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
}
const clampW = (v) => Math.max(0.9, Math.min(v, 7));

function strokeType(t, wBase) {
  const st = STYLE[t], list = L[t];
  if (!list.length) return;
  const x0 = cx - W / 2 / s, x1 = cx + W / 2 / s, z0 = cz - H / 2 / s, z1 = cz + H / 2 / s;
  const path = new Path2D(); let n = 0;
  for (const o of list) {
    const b = o.b;
    if (b[2] < x0 || b[0] > x1 || b[3] < z0 || b[1] > z1) continue;
    const p = o.p;
    path.moveTo(sx(p[0]), sy(p[1]));
    for (let i = 2; i < p.length; i += 2) path.lineTo(sx(p[i]), sy(p[i + 1]));
    n++;
  }
  if (!n) return;
  const w = wBase * st.w;
  if (st.casing) { ctx.setLineDash([]); ctx.globalAlpha = 1; ctx.strokeStyle = CASING; ctx.lineWidth = Math.max(0.7, w) + 1.2; ctx.stroke(path); }
  ctx.strokeStyle = st.col; ctx.globalAlpha = st.alpha; ctx.lineWidth = Math.max(0.7, w);
  ctx.setLineDash(st.dash ? st.dash.map((d) => d * Math.max(1, w * 0.6)) : []);
  ctx.stroke(path);
}

function drawJumps(wBase) {
  if (!J.length) return;
  ctx.setLineDash([]); ctx.globalAlpha = 1; ctx.lineCap = 'round';
  const head = Math.max(5, wBase * 2.2);
  for (const [ax, az, bx, bz] of J) {
    const x0 = sx(ax), y0 = sy(az), x1 = sx(bx), y1 = sy(bz);
    if ((x0 < -50 && x1 < -50) || (x0 > W + 50 && x1 > W + 50) || (y0 < -50 && y1 < -50) || (y0 > H + 50 && y1 > H + 50)) continue;
    const ang = Math.atan2(y1 - y0, x1 - x0), len = Math.hypot(x1 - x0, y1 - y0), h = Math.min(head, len * 0.6);
    const hx = x1 - Math.cos(ang) * h, hy = y1 - Math.sin(ang) * h;
    const arrow = () => {
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(hx, hy);
      ctx.moveTo(x1, y1); ctx.lineTo(x1 - Math.cos(ang - 0.45) * h, y1 - Math.sin(ang - 0.45) * h);
      ctx.moveTo(x1, y1); ctx.lineTo(x1 - Math.cos(ang + 0.45) * h, y1 - Math.sin(ang + 0.45) * h);
    };
    arrow(); ctx.strokeStyle = CASING; ctx.lineWidth = Math.max(1.4, wBase * 0.7) + 1.8; ctx.stroke();
    arrow(); ctx.strokeStyle = JUMP; ctx.lineWidth = Math.max(1.4, wBase * 0.7); ctx.stroke();
  }
}

function draw() {
  raf = 0;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const wBase = clampW(s * 7);
  for (const t of ORDER) strokeType(t, wBase);
  drawJumps(wBase);
  ctx.globalAlpha = 1; ctx.setLineDash([]);
}
const redraw = () => { if (!raf) raf = requestAnimationFrame(draw); };

// ---- interaction ----
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  const k = Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.0015)), ns = Math.max(MIN_S, Math.min(MAX_S, s * k));
  const wx = cx + (e.clientX - W / 2) / s, wz = cz - (e.clientY - H / 2) / s;     // world point under the cursor stays put
  s = ns; cx = wx - (e.clientX - W / 2) / s; cz = wz + (e.clientY - H / 2) / s;
  redraw();
}, { passive: false });
let drag = null;
cv.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, cx, cz }; cv.setPointerCapture(e.pointerId); document.body.classList.add('drag'); });
cv.addEventListener('pointermove', (e) => { if (!drag) return; cx = drag.cx - (e.clientX - drag.x) / s; cz = drag.cz + (e.clientY - drag.y) / s; redraw(); });
const endDrag = () => { drag = null; document.body.classList.remove('drag'); };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('dblclick', fit);
const BD = ['', 'bd-check', 'bd-dark']; let bd = 0;
addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'b') { document.body.classList.remove('bd-check', 'bd-dark'); bd = (bd + 1) % BD.length; if (BD[bd]) document.body.classList.add(BD[bd]); }
  else if (k === 'f' || k === '0') fit();
});
addEventListener('resize', () => { resize(); redraw(); });

resize(); fit();
// optional  #x,z,scale[,backdrop 0..2]  (world metres, px per metre) e.g. #3000,600,0.8,2
{
  const h = location.hash.slice(1).split(',').map(Number);
  if (h.length >= 3 && h.slice(0, 3).every(Number.isFinite)) { cx = h[0]; cz = h[1]; s = Math.max(MIN_S, Math.min(MAX_S, h[2])); draw(); }
  if (h[3] > 0 && h[3] < BD.length) { bd = h[3]; document.body.classList.add(BD[bd]); }
}
const hint = document.getElementById('hint');
setTimeout(() => hint.classList.add('on'), 300); setTimeout(() => hint.classList.remove('on'), 6000);
// test / debug hook
window.__P2D = { counts: have, expected: DATA.counts, src: DATA.src, setView: (x, z, sc) => { cx = x; cz = z; s = sc; draw(); }, fit, bounds: BOUNDS };
</script>
</body>
</html>
